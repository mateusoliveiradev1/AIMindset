        function slugify(text) {
            return text.toString().toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^\w\s-]/g, '')
                .trim().replace(/\s+/g, '-');
        }

        async function generateWithGemini(key, topic, cluster) {
            const prompt = `Gere um artigo técnico e profundo (mínimo 1000 palavras no total) sobre como a Inteligência Artificial está transformando a área de "${topic}" (pertencente ao cluster "${cluster}") em 2026.
            
            O artigo DEVE ser em Markdown e seguir esta estrutura rigorosa:
            1. Título principal impactante com H1.
            2. Introdução estratégica.
            3. Seção "O Novo Paradigma em ${topic}": Como as IAs multimodais e agentes autônomos estão mudando o setor.
            4. Tabela "Top 5 Ferramentas de IA para ${topic}": Inclua 5 ferramentas REAIS e ESPECÍFICAS para este nicho, com colunas Nome, Função e Diferencial.
            5. Seção "Guia de Implementação 2026": 3 passos práticos.
            6. Seção "Desafios e Ética": Pontos críticos do uso de IA neste nicho.
            7. Seção "FAQ (Perguntas Frequentes)": 3 a 5 perguntas e respostas ÚNICAS E TÉCNICAS sobre este nicho.
            
            IMPORTANTE: NÃO use templates genéricos. Pesquise mentalmente ferramentas REAIS que um profissional de ${topic} usaria. Use negrito em termos técnicos. Linguagem de alta autoridade.`;

            const resp = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash-latest:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { maxOutputTokens: 2500 }
                })
            });

            if (!resp.ok) throw new Error(`Gemini Error: ${resp.status}`);
            const json = await resp.json();
            return json.candidates[0].content.parts[0].text;
        }

                        page_type: 'guide',

                        is_published: true
                    });

                    if (error) throw error;

                    success++;
                    document.getElementById('current-count').innerText = success;
                    log(`✅ Sucesso: ${niche.topic}`, "success");
